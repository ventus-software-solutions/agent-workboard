name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.storage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage:
          - json
          - sqlite
          - tasksdir
    env:
      WORKBOARD_STORAGE: ${{ matrix.storage }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install sqlite3
        run: sudo apt-get install -y --no-install-recommends sqlite3

      - name: Verify sqlite3 is available
        run: sqlite3 -version

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (${{ matrix.storage }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        storage:
          - json
          - sqlite
          - tasksdir
    env:
      CI: true
      WORKBOARD_STORAGE: ${{ matrix.storage }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install sqlite3
        if: matrix.storage == 'sqlite'
        run: sudo apt-get install -y --no-install-recommends sqlite3

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.storage }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
