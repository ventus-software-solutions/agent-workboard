name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.storage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage:
          - json
          - sqlite
          - tasksdir
    env:
      WORKBOARD_STORAGE: ${{ matrix.storage }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install sqlite3
        run: sudo apt-get install -y --no-install-recommends sqlite3

      - name: Verify sqlite3 is available
        run: sqlite3 -version

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
