name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build, for example v0.1.0
        required: true
      latest:
        description: Also move the latest tag to this build
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  # attest-build-provenance v4 also writes an artifact metadata storage record.
  # Without this the attestation still publishes, but every run warns.
  artifact-metadata: write

concurrency:
  group: image-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agent-workboard

jobs:
  # Each platform builds on its own native runner. Building linux/arm64 on an
  # amd64 runner means QEMU emulation, and this image runs npm ci twice, which
  # took over 30 minutes and timed out. Native runners take a few minutes each
  # and run in parallel.
  build:
    if: github.repository == 'ventus-software-solutions/agent-workboard'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Resolve build ref
        id: ref
        run: echo "value=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.value }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Agent Workboard
            org.opencontainers.image.description=Local-first project and task board for coordinating AI agents
            org.opencontainers.image.licenses=MIT

      # Push by digest only. The merge job assembles the tags from these.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The filename is the bare digest with no "sha256:" prefix: upload-artifact
      # rejects colons in paths, and the merge job prepends the prefix back.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.repository == 'ventus-software-solutions/agent-workboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve build ref
        id: ref
        run: echo "value=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for the manifest list
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.value }}
            type=raw,value=beta,enable=${{ github.event.release.prerelease || false }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && (github.event_name != 'workflow_dispatch' || inputs.latest) }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Read merged digest
        id: manifest
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.metadata.outputs.version }}" --format '{{ json .Manifest }}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.metadata.outputs.version }}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
