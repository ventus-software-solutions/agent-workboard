services:
  agent-workboard:
    build: .
    container_name: agent-workboard
    ports:
      - '127.0.0.1:8088:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      WORKBOARD_HOST: "0.0.0.0"
      WORKBOARD_DATA_DIR: /data
    volumes:
      - ./.workboard-data:/data
    restart: unless-stopped
