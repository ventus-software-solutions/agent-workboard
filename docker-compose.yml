services:
  agent-workboard:
    build: .
    container_name: agent-workboard
    ports:
      - '127.0.0.1:8088:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      WORKBOARD_HOST: "0.0.0.0"
      WORKBOARD_DATA_DIR: /data
      WORKBOARD_STORAGE: sqlite
      WORKBOARD_REPO_DIR: /workspace
      WORKBOARD_CLEANUP_MUTATIONS: "false"
      WORKBOARD_GITHUB_REPOSITORY: "${WORKBOARD_GITHUB_REPOSITORY:-}"
      WORKBOARD_GITHUB_TOKEN: "${WORKBOARD_GITHUB_TOKEN:-}"
      WORKBOARD_GITHUB_PROJECT_KEY: "${WORKBOARD_GITHUB_PROJECT_KEY:-}"
    volumes:
      - ./.workboard-data:/data
      - ./:/workspace:ro
    restart: unless-stopped
